<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subnet Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <div class="title-wrap">
          <span class="kicker">Network utility</span>
          <h1>Subnet Calculator</h1>
        </div>
        <div class="status-pill">VLSM</div>
      </div>

      <main class="panel">
        <div class="section-header">
          <h2>Konfigurasi Jaringan</h2>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="startIp">Start IP (Network Address)</label>
            <input type="text" id="startIp" placeholder="Contoh: 192.168.1.0" value="192.168.1.0" />
          </div>
        </div>

        <div id="ipError" class="error" aria-live="polite"></div>

        <div class="section-header" style="margin-top: 24px;">
          <h2>Tambah Departemen / Jaringan</h2>
        </div>

        <div class="input-row">
          <div class="field large">
            <label for="deptName">Nama Departemen</label>
            <input type="text" id="deptName" placeholder="Contoh: Umum" />
          </div>

          <div class="field small">
            <label for="hostCount">Jumlah Host</label>
            <input type="number" id="hostCount" placeholder="Contoh: 9" min="1" max="65534" />
          </div>

          <button type="button" class="btn btn-secondary" id="addDeptBtn">+ Tambah</button>
        </div>

        <div id="addError" class="error" aria-live="polite"></div>

        <div class="host-list" id="hostList"></div>

        <button type="button" class="btn btn-primary" id="calculateBtn" style="width:100%;">Hitung Subnetting</button>
      </main>

      <section class="results" id="results">
        <div class="empty">Tambahkan departemen lalu klik hitung untuk melihat hasil.</div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
