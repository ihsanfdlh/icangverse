<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ICANG VERSE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface-dim": "#e7d7cf",
                        "outline-variant": "#dac1b5",
                        "surface-container-highest": "#f0dfd8",
                        "surface-container": "#fceae3",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#382e29",

                        "secondary": "#785a00",

                        "error-container": "#ffdad6",

                        "primary": "#964913",

                        "on-secondary-fixed-variant": "#5b4300",
                        "on-background": "#221a15",

                        "on-error-container": "#93000a",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xs": "4px",
                        "gutter": "20px",
                        "lg": "40px",
                        "sm": "12px",
                        "xl": "64px",
                        "base": "8px",
                        "margin-desktop": "48px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],

                    }
                }
            }
        }

<style>
        /* Custom styles to handle specific hard shadow offsets and shapes not covered by default tailwind utilities */
        .sticker-shadow-lg {
            box-shadow: 8px 8px 0px 0px #221a15;
        }
        .sticker-shadow {
            box-shadow: 4px 4px 0px 0px #221a15;
        }
        .sticker-shadow-hover {
            box-shadow: 2px 2px 0px 0px #221a15;
        }
        .recessed-shadow {
            box-shadow: inset 2px 2px 0px 0px rgba(34,26,21,0.05);
        }
        .wobbly-line {
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='2' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,1 Q10,2 20,1 T40,1 T60,1 T80,1 T100,1' fill='none' stroke='%23221a15' stroke-width='2' stroke-linecap='round' vector-effect='non-scaling-stroke'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
            height: 2px;
            border: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">
<!-- Left Side: Illustration Container (Hidden on Mobile) -->
<div class="hidden lg:flex w-1/2 relative bg-surface-container-high border-r-2 border-on-surface overflow-hidden">
<!-- Abstract Pattern Background for the illustration side -->
<div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#221a15 1px, transparent 1px); background-size: 20px 20px;"></div>
<div class="absolute inset-0 w-full h-full p-margin-desktop flex items-center justify-center">
<!-- Using an image placeholder with a highly detailed prompt for the messy desk illustration -->
<img class="w-full h-full object-contain max-w-2xl transform -rotate-1 transition-transform duration-500 hover:rotate-1" data-alt="A detailed, vibrant 2D cartoon illustration of a messy, creative computer desk workspace. The scene is drawn in a 'Premium Doodle' style with bold charcoal outlines and solid, flat colors primarily in cream, vibrant orange, and soft coral. The desk is cluttered with hand-drawn looking sticky notes, scattered pens, a slightly crooked coffee mug, and a modern computer monitor displaying abstract code or shapes. The lighting is bright and flat, emphasizing the playful, tactile sticker-like quality of the objects against a warm, paper-like background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFzKjn9EBuEJlefM60_GHX7Hd98vR8Kz1rd7bhW_Iy88yo9UMI5i2MYYrNp1KRvRADrWaKgy7h9UBjx0iY8O8E61KMsI2Q_hDJjGajPSoYtV3-mSVwMyOEn8AUD_OwqHn9tKZwZ86Cn81QGUULJ9JlnnQoL_zwJEyKHw_h3kGTaDmves06WfLtRs_V1CX_uQuWLTKnl1F7ot5lmDOLLNMCszu8YspzGOytOb8Jr-2B20CfLuXkWqhu3Q"/>
</div>
<!-- Decorative floating stickers (SVG outlines) -->
<svg class="absolute top-1/4 left-10 w-12 h-12 text-primary" fill="currentColor" stroke="#221a15" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
</svg>
<svg class="absolute bottom-1/4 right-10 w-16 h-16 text-secondary-container" fill="currentColor" stroke="#221a15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"></path>
</svg>
</div>
<!-- Right Side: Login Form Area -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop relative">
<!-- Background decorative elements for mobile -->
<div class="lg:hidden absolute top-10 left-10 w-8 h-8 rounded-full bg-secondary-container border-2 border-on-surface sticker-shadow"></div>
<div class="lg:hidden absolute bottom-20 right-10 w-12 h-12 bg-tertiary-container border-2 border-on-surface sticker-shadow rotate-12"></div>
<!-- Main Login Card (Sticker Container) -->
<div class="w-full max-w-md bg-surface border-2 border-on-surface rounded-xl p-8 sticker-shadow-lg transform rotate-1 relative z-10">
<!-- Header Section -->
<div class="mb-8 transform -rotate-1">
<h1 class="font-display text-display text-on-surface mb-2">Welcome Back! 👋</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Let's get back to building stuff.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6 transform -rotate-1" method="POST">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="email">Email Address</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container-lowest border-2 border-on-surface rounded-lg pl-10 pr-4 py-3 font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-on-surface transition-all recessed-shadow" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-bold text-label-bold text-on-surface block" for="password">Password</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface-container-lowest border-2 border-on-surface rounded-lg pl-10 pr-4 py-3 font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-on-surface transition-all recessed-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me & Forgot Password -->
<div class="flex items-center justify-between pt-2">
<div class="flex items-center">
<input class="h-5 w-5 rounded-sm border-2 border-on-surface text-primary-container focus:ring-primary-container focus:ring-offset-background bg-surface cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-label-bold text-label-bold text-primary hover:text-primary-tint underline decoration-2 underline-offset-4 transition-colors" href="#">
                            Forgot password?
                        </a>
</div>
</div>
<!-- Primary CTA Button -->
<div class="pt-4">
<button class="w-full flex justify-center items-center gap-2 bg-primary-container text-on-primary-container font-label-bold text-label-bold py-4 px-8 rounded-lg border-2 border-on-surface sticker-shadow hover:translate-x-[2px] hover:translate-y-[2px] hover:sticker-shadow-hover active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all duration-150 ease-out cursor-pointer" type="submit">
<span>Login</span>
<span aria-hidden="true" class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative flex items-center justify-center transform -rotate-1">
<div class="w-full wobbly-line absolute inset-0 top-1/2 -translate-y-1/2"></div>
<span class="bg-surface px-4 font-body-md text-body-md text-on-surface-variant relative z-10 border-2 border-on-surface rounded-full py-1">or</span>
</div>
<!-- Sign Up Link -->
<div class="text-center transform -rotate-1">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-bold text-label-bold text-on-surface hover:text-primary underline decoration-2 underline-offset-4 transition-colors" href="#">
                        Sign up here
                    </a>
</p>
</div>
<!-- Small doodle accent on the card -->
<svg class="absolute -top-4 -right-4 w-10 h-10 text-secondary-container transform rotate-12" fill="currentColor" stroke="#221a15" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"></path>
</svg>
</div>
</div>
</body></html>
