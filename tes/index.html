$result = mysqli_query($conn,"
SELECT
    d.*,
    COUNT(DISTINCT l.id) AS total_likes,
    ROUND(AVG(r.rating),1) AS avg_rating
FROM data d
LEFT JOIN likes l
    ON l.mod_id = d.id_unik
LEFT JOIN ratings r
    ON r.mod_id = d.id_unik
GROUP BY d.id
ORDER BY d.kategori ASC, d.date DESC
");

$mods = [];
$categories = [];

while($row = mysqli_fetch_assoc($result)){
    $mods[] = $row;
    if(!in_array($row['kategori'],$categories)){
        $categories[] = $row['kategori'];
    }
}

<script>
const searchInput = document.getElementById("searchInput");
const modGrid     = document.getElementById("modGrid");
const tabs        = document.querySelectorAll(".cat-tab");
const sortBtn     = document.getElementById("sortBtn");
const sortDropdown= document.getElementById("sortDropdown");
const sortWrapper = document.getElementById("sortWrapper");
const LOGGED_IN   = <?= json_encode(!empty($_SESSION['user'])) ?>;

const sortLabels = {
  newest: "Terbaru", oldest: "Terlama",
  name_asc: "Nama A–Z", name_desc: "Nama Z–A",
  category_asc: "Kategori A–Z"
};

let activeCategory = "all";
let activeSort     = "newest";

// ── SORT DROPDOWN ───────────────────────────────────
sortBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const open = sortDropdown.style.display !== "block";
  sortDropdown.style.display = open ? "block" : "none";
  sortBtn.classList.toggle("open", open);
});

document.addEventListener("click", () => {
  sortDropdown.style.display = "none";
  sortBtn.classList.remove("open");
});

sortDropdown.querySelectorAll(".sort-option").forEach(opt => {
  opt.addEventListener("click", () => {
    sortDropdown.querySelectorAll(".sort-option").forEach(o => {
      o.classList.remove("active");
      const chk = o.querySelector(".check");
      if (chk) chk.remove();
    });
    opt.classList.add("active");
    const chk = document.createElement("i");
    chk.className = "ti ti-check check";
    opt.appendChild(chk);
    activeSort = opt.dataset.val;
    document.getElementById("sortLabel").textContent = sortLabels[activeSort];
    sortDropdown.style.display = "none";
    sortBtn.classList.remove("open");
    renderMods();
  });
});

// ── FILTER + SORT ───────────────────────────────────
function renderMods() {
  const keyword = searchInput.value.toLowerCase();
  const cards   = Array.from(document.querySelectorAll(".mod-card"));

  // Filter
  const visible = cards.filter(c => {
    const matchName = c.dataset.name.includes(keyword);
    const matchCat  = activeCategory === "all" || c.dataset.category === activeCategory;
    return matchName && matchCat;
  });
  const hidden = cards.filter(c => !visible.includes(c));

  // Sort visible
  visible.sort((a, b) => {
    switch (activeSort) {
      case "newest":       return new Date(b.dataset.date) - new Date(a.dataset.date);
      case "oldest":       return new Date(a.dataset.date) - new Date(b.dataset.date);
      case "name_asc":     return a.dataset.name.localeCompare(b.dataset.name);
      case "name_desc":    return b.dataset.name.localeCompare(a.dataset.name);
      case "category_asc": return a.dataset.category.localeCompare(b.dataset.category);
    }
  });

  // Re-append in order
  [...visible, ...hidden].forEach(c => modGrid.appendChild(c));
  visible.forEach(c => c.style.display = "block");
  hidden.forEach(c  => c.style.display = "none");
}

searchInput.addEventListener("input", renderMods);

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeCategory = tab.dataset.filter;
    renderMods();
  });
});
    
renderMods();
</script>
